name: AUTOX E2E & Production Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Run Unit, Integration & Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm run install:all

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: Seed Isolated Test Database
        env:
          PORT: 5000
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/autox_ci_test
          JWT_SECRET: autox_ci_test_jwt_secret_key_12345
          COOKIE_SECRET: autox_ci_test_cookie_secret_key_12345
          ADMIN_NAME: "AUTOX Admin"
          ADMIN_EMAIL: admin@autox.pk
          ADMIN_PASSWORD: Admin@AutoX2026!
        run: npm run seed

      - name: Run Server & Client Unit/Integration Test Suites
        run: npm run test:all

      - name: Compile Frontend Production Build
        run: npm run build

      - name: Run Playwright E2E Browser Automation
        env:
          CI: true
          PORT: 5000
          MONGODB_URI: mongodb://127.0.0.1:27017/autox_ci_test
          JWT_SECRET: autox_ci_test_jwt_secret_key_12345
          COOKIE_SECRET: autox_ci_test_cookie_secret_key_12345
        run: npx playwright test --project="Desktop Chromium"

      - name: Upload Playwright Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Failure Screenshots & Traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
