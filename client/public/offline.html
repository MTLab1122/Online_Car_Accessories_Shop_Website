<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline Mode | AUTOX Pakistan</title>
  <meta name="theme-color" content="#080A0D">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #080A0D;
      color: #F5F5F5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      overflow-x: hidden;
    }
    .container {
      max-width: 520px;
      width: 100%;
      background: #101318;
      border: 1px solid #1E232B;
      border-radius: 24px;
      padding: 48px 32px;
      position: relative;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: rgba(255, 90, 31, 0.1);
      border: 1px solid rgba(255, 90, 31, 0.25);
      border-radius: 9999px;
      color: #FF5A1F;
      font-size: 11px;
      font-family: monospace;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 24px;
    }
    .pulse-dot {
      width: 6px;
      height: 6px;
      background: #FF5A1F;
      border-radius: 50%;
      box-shadow: 0 0 10px #FF5A1F;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    .logo {
      width: 56px;
      height: 56px;
      margin: 0 auto 20px auto;
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      color: #FFFFFF;
      margin-bottom: 12px;
      line-height: 1.2;
    }
    h1 span {
      color: #FF5A1F;
    }
    p {
      color: #9299A3;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #FF5A1F;
      color: #FFFFFF;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 13px;
      font-family: monospace;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border: none;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255, 90, 31, 0.35);
      transition: all 0.2s ease;
    }
    .btn-primary:hover {
      background: #E04B14;
      box-shadow: 0 0 35px rgba(255, 90, 31, 0.5);
    }
    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #15191F;
      color: #C5CBD3;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 12px;
      font-family: monospace;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border: 1px solid #1E232B;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-secondary:hover {
      border-color: #303741;
      color: #FFFFFF;
    }
    .status-text {
      font-size: 11px;
      font-family: monospace;
      color: #6C727D;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">
      <span class="pulse-dot"></span>
      Telemetry Disconnected
    </div>

    <svg class="logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" rx="20" fill="#080A0D"/>
      <rect x="5" y="5" width="90" height="90" rx="16" fill="#15191F" stroke="#303741" stroke-width="2"/>
      <path d="M28 28 L72 72 M72 28 L28 72" stroke="#FF5A1F" stroke-width="12" stroke-linecap="round"/>
    </svg>

    <h1>Your drive doesn't stop.<br><span>Your connection might.</span></h1>
    <p>
      You are currently offline or experiencing a cellular telemetry loss. Previously loaded catalog equipment and technical guides remain cached and accessible.
    </p>

    <div class="actions">
      <button class="btn-primary" onclick="retryConnection()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
          <path d="M21 3v5h-5"/>
          <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
          <path d="M8 16H3v5"/>
        </svg>
        Re-Establish Link
      </button>

      <a href="/" class="btn-secondary">
        Return to Cached Catalog
      </a>
    </div>

    <div class="status-text" id="statusMsg">
      Automatic reconnection sensor active...
    </div>
  </div>

  <script>
    function retryConnection() {
      const msg = document.getElementById('statusMsg');
      msg.textContent = 'Pinging AUTOX master servers...';
      if (navigator.onLine) {
        window.location.reload();
      } else {
        setTimeout(() => {
          msg.textContent = 'Network link still unavailable. Please check your data connection.';
        }, 1200);
      }
    }

    window.addEventListener('online', () => {
      document.getElementById('statusMsg').textContent = 'Connection restored! Reloading application...';
      window.location.reload();
    });
  </script>
</body>
</html>
